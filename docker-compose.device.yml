# Puts the server's file on a block device, with no filesystem in the way:
# bench/run.sh --data device takes the device from WHEELIE_DEVICE. The device
# is written to, so it must be one that nothing else uses.

services:
  server:
    devices:
      - ${WHEELIE_DEVICE}:/dev/wheelie-bench:rwm
    environment:
      WHEELIE_FILE: /dev/wheelie-bench
