name: ci

on:
  push:

jobs:
  linter:

    runs-on: ubuntu-latest

    # Reads contributor-controlled commit metadata: the token needs no
    # more than checkout access, whatever the repository default is.
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: commit-messages
      run: ./.github/tools/commit-messages.sh
    - name: add llvm 21
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 21 all
    - name: clang-format
      run: ./.github/tools/clang-format.sh

  tests:

    runs-on: ubuntu-latest

    env:
      ASAN_OPTIONS: detect_odr_violation=0

    steps:
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libtool liburing-dev libgtest-dev
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: autogen
      run: ./autogen.sh
    - name: configure
      run: ./configure --enable-asan
    - name: make
      run: make -j$(nproc)
    # The engine can only be loaded by the fio it is built for, so fio is built
    # from the same source, after the engine: fio's configure runs in the
    # source tree here, and the engine is built against a clean one.
    - name: build fio
      run: |
        cd 3rdparty/fio
        ./configure
        make -j$(nproc)
    - name: make test
      run: make test
      env:
        FIO: ${{ github.workspace }}/3rdparty/fio/fio
        WHEELIE_FIO_REQUIRED: 1
